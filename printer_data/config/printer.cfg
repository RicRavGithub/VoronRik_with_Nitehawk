#####################################################################
#   Extruder
#####################################################################

[extruder]                 # !!! Old configuration
step_pin: nhk:gpio23
dir_pin: nhk:gpio24
enable_pin: !nhk:gpio25
## Official baseline rotation distance for Bondtech LGX Lite Pro
## Update value below when you perform precise extruder calibration:
## rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
rotation_distance: 22.24725394 #3.99 with LGX Lite Pro

## NOTE: The internal gear ratio is already baked into the 3.99 rotation_distance by Bondtech.
## Do NOT define or uncomment a gear_ratio parameter here, as it will cause severe under-extrusion.
gear_ratio: 50:10
#gear_ratio:
microsteps: 32
full_steps_per_rotation: 200    #200 for 1.8 degree stepper (standard for LGX Lite Pro), 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: nhk:gpio9
# Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
# Use "Generic 3950" for NTC 100k 3950 thermistors
#sensor_type: Trianglelab_T-D500
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:gpio29
pullup_resistor: 2200
min_temp: -20
max_temp: 310

max_power: 1.0
min_extrude_temp: 10
max_extrude_only_distance: 101  # Used for https://ellis3dp.com/Print-Tuning-Guide/articles/extruder_calibration.html
max_extrude_cross_section: 5
control = pid
pid_kp = 31.455
pid_ki = 5.668
pid_kd = 43.644
#  Try to keep pressure_advance below 1.0
pressure_advance: 0.045
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5

##  E0 on MOTOR6
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
run_current: 0.6   #0.65 with 0.65 A: chamber: 60°C NH: 92°C
sense_resistor: 0.100 #0.110
stealthchop_threshold: 0

[firmware_retraction]
retract_length: 1
retract_speed: 20	#35
unretract_extra_length: 0
unretract_speed: 10	#35

#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PF6 #HE0 Port
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PB1 #THB Port
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 0.66
min_temp: 0
max_temp: 120
control: pid
pid_kp = 43.205
pid_ki = 0.615
pid_kd = 758.243

[verify_heater heater_bed]
max_error: 120          # Klipper Standard Sesibility
check_gain_time: 180     # Bed Temperature must raise 2°C in 3 minutes
hysteresis: 5           # 5°C of tolerance during the print

#####################################################################
#   Probe (Remove this section with beacon)
#####################################################################

##  Inductive Probe
##  This probe is not used for Z height, only Quad Gantry Leveling
[probe]
pin: !nhk:gpio10
x_offset: 0
y_offset: 0 #default:25.0
#z_offset: -0.218
speed: 10.0
lift_speed: 30
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.0075
samples_tolerance_retries: 8

activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}
    

