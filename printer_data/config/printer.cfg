[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
  # Macro inspired from: https://github.com/jontek2/A-better-print_start-macro
  # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_nozzle_diameter = params.NOZZLE_DIAMETER|float %}
  {% set purge_height = target_nozzle_diameter / 2 %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
   
  # If the requested chamber temperature is 40°C or higher AND the chamber 
  # has not reached that target yet, temporarily overdrive the bed to 119°C.
  # This aggressive overshoot acts as a powerful radiator to warm up the chamber faster. 
  # Otherwise, set the standard target bed temperature immediately.
  {% if target_chamber >= 40 and printer["temperature_sensor chamber"].temperature < target_chamber %}
    M140 S119                                         
  {% else %}
    M140 S{target_bed}                                
  {% endif %}
  M104 S150

  # Homes the printer, sets absolute positioning and updates the Stealthburner leds.
  #STATUS_HOMING         # Sets SB-leds to homing-mode
  G28                   # Full home (XYZ)
  G90                   # Absolut position

  SKEW_PROFILE LOAD=my_skew_profile

  # Start setting temperature
  #STATUS_HEATING                                      # Sets SB-leds to heating-mode
  SET_FAN_SPEED FAN=Nevermore SPEED=1                 # Turns on Nevermore filter
  # Check that PT Fan is working properly
  PREFLIGHT_CHECK                                     # Checks that PT Fan tachometer shows that it's running
  # Now it's safe to turn on the hotend, so go on setting other temperatures
  M106 S255                                           # Turns on the PT-fan
  G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
  SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Displays info
  RESPOND TYPE=command MSG="Heatsoak: {target_chamber}c"
  TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber to reach desired temp
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
  RESPOND TYPE=command MSG="Bed: {target_bed}c"
  M190 S{target_bed}                                  # Set the target temp for the bed

  #  Uncomment for bed mesh (1 of 2)
  BED_MESH_CLEAR       # Clears old saved bed mesh (if any)

  # Heating nozzle to 150 degrees. This helps with getting a correct Z-home
  SET_DISPLAY_TEXT MSG="Hotend: 150c"          # Displays info
  RESPOND TYPE=command MSG="Hotend: 150c"
  M109 S150                                    # Heats the nozzle to 150c
  clean_nozzle                                 # Clean Nozzle before measuring

  #  Uncomment for V2 (Quad gantry level AKA QGL)
  SET_DISPLAY_TEXT MSG="QGL"      # Displays info
  RESPOND TYPE=command MSG="QGL"
  #STATUS_LEVELING                 # Sets SB-leds to leveling-mode
  quad_gantry_level               # Levels the buildplate via QGL
  G28 Z                           # Homes Z again after QGL

  #  Uncomment for bed mesh (2 of 2)
  SET_DISPLAY_TEXT MSG="Bed mesh adattiva"    # Displays info
  RESPOND TYPE=command MSG="Bed mesh adattiva"
  #STATUS_MESHING                     
  # Sfrutta il motore nativo di Klipper per calcolare la mesh solo sull'area di stampa effettiva
  bed_mesh_calibrate ADAPTIVE=1

  #enable filament sensors
#  SET_FILAMENT_SENSOR SENSOR=filament_PreExtr ENABLE=1                         ; enable filament sensor
#  SET_FILAMENT_SENSOR SENSOR=filament_PostExtr ENABLE=1                        ; enable filament sensor

  # Heats up the nozzle up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"             # Displays info
  RESPOND TYPE=command MSG="Hotend: {target_extruder}c"
  #STATUS_HEATING                                                # Sets SB-leds to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                              # Goes to center of the bed
  M107                                                          # Turns off partcooling fan
  M109 S{target_extruder}                                       # Heats the nozzle to printing temp

  clean_nozzle                                     # Clean Nozzle again, now @right temperature
  SET_PIN PIN=caselight VALUE=0.50                 # increase chamber light to 50%
  
  # Gets ready to print by doing a purge line and updating the SB-leds
  SET_DISPLAY_TEXT MSG="Spurgo filamento..."          
  RESPOND TYPE=command MSG="Spurgo filamento..."

  G0 X0 Y0 F10000                                  # Moves to the front-left corner
  G0 Z{purge_height}                               # Sets purge height to half the nozzle diameter
  G1 X100 E14 F1200                                # Single 100mm purge line
  G92 E0                                            # Resets the extruder position

  SET_DISPLAY_TEXT MSG="Printer goes brr"           # Displays info
  RESPOND TYPE=command MSG="Printer goes brr"
  #STATUS_PRINTING                                  # Sets SB-leds to printing-mode
  G0 X{x_wait - 50} Y4 F10000                      # Moves to starting point

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # s#fe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 30, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    # disable filament sensors
    SET_FILAMENT_SENSOR SENSOR=filament_PreExtr ENABLE=0                                 ; disable filament sensor
    SET_FILAMENT_SENSOR SENSOR=filament_PostExtr ENABLE=0                                ; disable filament sensor
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    #M140 S100                      ; ************************ TEMPORANEO ************************

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F15000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    SET_PIN PIN=caselight VALUE=0.20         # decrease chamber light to 20%
    SET_FAN_SPEED FAN=Nevermore SPEED=0      # Turns off Nevermore filter
    
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _BASE_QUAD_GANTRY_LEVEL
gcode:
    # Se il gantry non è mai stato livellato dall'accensione
    {% if printer.quad_gantry_level.applied == False %}
        {action_respond_info("Gantry fortemente inclinato rilevato. Avvio raddrizzamento di sicurezza...")}
        
        # Primo passaggio ultra-sicuro: tolleranza enorme e altezza di sicurezza a 40mm
        _BASE_QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0 HORIZONTAL_MOVE_Z=40 MAX_ADJUST=39
        
        # Reset obbligatorio dello zero di Z perché la geometria è cambiata drasticamente
        G28 Z
    {% endif %}

    # Chiamata alla macro secondaria per la finitura di precisione.
    # Isolarla qui forza Klipper a rivalutare lo stato solo quando questa riga viene effettivamente eseguita.
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {action_respond_info("Avvio calibrazione QGL di precisione...")}
    # Esegue il QGL finale usando i parametri stretti definiti nel tuo [quad_gantry_level] nativo
    _BASE_QUAD_GANTRY_LEVEL

[gcode_shell_command backup_cfg]
command: /usr/bin/bash /home/ricrav/klipper-backup/script.sh
timeout: 60
verbose: True

[gcode_macro BACKUP_CFG]
description: Backs up config directory GitHub
gcode:
  RUN_SHELL_COMMAND CMD=backup_cfg

[gcode_macro PAUSE]
;from: https://ellis3dp.com/Print-Tuning-Guide/articles/useful_macros/pause_resume_filament.html
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        SET_FILAMENT_SENSOR SENSOR=filament_PreExtr ENABLE=0                                 ; disable filament sensor
        SET_FILAMENT_SENSOR SENSOR=filament_PostExtr ENABLE=0                                ; disable filament sensor
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_FILAMENT_SENSOR SENSOR=filament_PreExtr ENABLE=1                         ; enable filament sensor
        SET_FILAMENT_SENSOR SENSOR=filament_PostExtr ENABLE=1                        ; enable filament sensor
        #INITIAL_RGB                                                                 ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    # disable filament sensors
    SET_FILAMENT_SENSOR SENSOR=filament_PreExtr ENABLE=0                                 ; disable filament sensor
    SET_FILAMENT_SENSOR SENSOR=filament_PostExtr ENABLE=0                                ; disable filament sensor
    CLEAR_PAUSE
    PRINT_END
    BASE_CANCEL_PRINT
    

[delayed_gcode DISABLEFILAMENTSENSOR]
;his disables the filament sensor 1 second after startup. 
;This prevents it from tripping constantly while you’re just loading filament, doing testing or maintenance, etc.
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_PreExtr ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=filament_PostExtr ENABLE=0

