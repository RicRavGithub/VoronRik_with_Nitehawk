# ====================================================================
# PRINT_START MACRO FOR BEACON REV H (CONTACT FEATURE)
# ====================================================================
# This macro orchestrates the start sequence. Ensure your slicer passes 
# the BED, EXTRUDER, and CHAMBER variables correctly in its start G-code.

[gcode_macro PRINT_START]
gcode:
  # ------------------------------------------------------------------
  # VARIABLE FETCHING & INITIAL SETUP
  # ------------------------------------------------------------------
  # Fetch data from your slicer variables and convert them to integers.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  # Calculate the exact center coordinates of your build volume.
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
   
  # Load the skew correction profile to ensure dimensional accuracy.
  SKEW_PROFILE LOAD=my_skew_profile

  # ------------------------------------------------------------------
  # ENCLOSURE AIR CIRCULATION PREP
  # ------------------------------------------------------------------
  # Turn on the Nevermore carbon filter and the part cooling fan (PT-fan)
  # at maximum speed. Moving the air inside the enclosure drastically 
  # reduces the time required to heat up the chamber.
  SET_FAN_SPEED FAN=Nevermore SPEED=1                 
  PREFLIGHT_CHECK                                     
  M106 S255                                           # Turns on the PT-fan

  # ====================================================================
  # 1) BED HEATING
  # ====================================================================
  SET_DISPLAY_TEXT MSG="Heating bed..."
  RESPOND TYPE=command MSG="Heating bed..."
  
  # If the requested chamber temperature is 40°C or higher AND the chamber 
  # has not reached that target yet, temporarily overdrive the bed to 119°C.
  # This aggressive overshoot acts as a powerful radiator to warm up the chamber faster. 
  # Otherwise, set the standard target bed temperature immediately.
  {% if target_chamber >= 40 and printer["temperature_sensor chamber"].temperature < target_chamber %}
    M140 S119                                         
  {% else %}
    M140 S{target_bed}                                
  {% endif %}

  # ====================================================================
  # 2) WAITING FOR CHAMBER TEMPERATURE (HEAT SOAK)
  # ====================================================================
  SET_DISPLAY_TEXT MSG="Heatsoak Chamber: {target_chamber}c" 
  RESPOND TYPE=command MSG="Heatsoak Chamber: {target_chamber}c"
  
  # Halt all printer operations until the chamber thermistor reaches the target
  # temperature. This heat soak phase is critical: it allows the aluminum frame,
  # the gantry, and the spring steel sheet to fully thermally expand and settle 
  # before taking any probing measurements.
  TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   
  
  # Once the chamber reaches the target, dial the bed temperature back down 
  # to the actual target required by the filament and wait for it to stabilize.
  SET_DISPLAY_TEXT MSG="Bed target: {target_bed}c"
  RESPOND TYPE=command MSG="Bed target: {target_bed}c"
  M190 S{target_bed}
  M106 S0			;turns off the PT fan (less vibrations during measurements)

  # ====================================================================
  # 3) INITIAL HOMING WITH BEACON (COLD HOTEND)
  # ====================================================================
  SET_DISPLAY_TEXT MSG="Homing XYZ..."
  RESPOND TYPE=command MSG="Homing XYZ..."
  
  # Perform the first full XYZ home. The hotend is kept completely cold at 
  # this stage to prevent filament oozing and to keep the toolhead fan quiet.
  G28                                                 
  G90                                                 
  # Clear any old bed mesh loaded in Klipper's memory to ensure a clean slate.
  BED_MESH_CLEAR                                      

  # ====================================================================
  # 4) QUAD GANTRY LEVEL (QGL)
  # ====================================================================
  SET_DISPLAY_TEXT MSG="Quad Gantry Leveling..."      
  RESPOND TYPE=command MSG="Quad Gantry Leveling..."
  
  # Align the flying gantry to the bed. The Beacon probe uses its high-speed
  # eddy current sensor to scan the four corners over the bare spring steel 
  # without physically touching it, adjusting the four independent Z motors.
  quad_gantry_level                                   

  # ====================================================================
  # 5) RE-HOMING Z AXIS
  # ====================================================================
  SET_DISPLAY_TEXT MSG="Re-homing Z after QGL..."      
  RESPOND TYPE=command MSG="Re-homing Z after QGL..."
  
  # Because the QGL process moved the independent Z motors to tram the gantry,
  # the overall Z height origin is now slightly shifted. A quick G28 Z 
  # restores perfect Z-axis spatial awareness.
  G28 Z                                               

  # ====================================================================
  # 6) ADAPTIVE BED MESH
  # ====================================================================
  SET_DISPLAY_TEXT MSG="Adaptive Bed Mesh..."    
  RESPOND TYPE=command MSG="Adaptive Bed Mesh..."
  
  # Generate a high-density bed mesh using Klipper's native adaptive feature.
  # It only scans the bounding box where the object will actually be printed.
  # Beacon performs this "on the fly" extremely fast, still with a cold nozzle.
  bed_mesh_calibrate ADAPTIVE=1                       

  # ====================================================================
  # 7) PARTIAL HOTEND HEATING (150°C)
  # ====================================================================
  SET_DISPLAY_TEXT MSG="Heating Hotend to 150c..."          
  RESPOND TYPE=command MSG="Heating Hotend to 150c..."
  
  # Move the toolhead to the center of the bed for a safe probing location.
  G1 X{x_wait} Y{y_wait} Z15 F9000                    
  
  # Heat the nozzle to 150°C. This specific temperature is the "sweet spot": 
  # it is hot enough to soften any residual plastic stuck on the nozzle tip, 
  # but cold enough to prevent oozing or melting the PEI build surface.
  M109 S150                                           
  # Scrub the nozzle on the brush to ensure the tip is completely clean 
  # before the physical contact probe.
  clean_nozzle                                        

  # ====================================================================
  # 8) AUTO Z-OFFSET (BEACON CONTACT)
  # ====================================================================
  SET_DISPLAY_TEXT MSG="Beacon Contact Z-Offset..."          
  RESPOND TYPE=command MSG="Beacon Contact Z-Offset..."
  
  # This triggers the Beacon Contact feature. The toolhead slowly descends 
  # until the physical nozzle taps the build plate, detected by the Beacon's 
  # onboard accelerometer. Klipper then automatically calculates the exact 
  # offset between the magnetic eddy current reading and this physical tap. 
  # Because the nozzle is at 150°C, thermal expansion is correctly accounted for.
  G28 Z METHOD=CONTACT CALIBRATE=1                    
  # Raise the toolhead to a safe height of 10mm after the tap.
  G1 Z10 F3000                                        

  # ====================================================================
  # 9) FINAL HEATING AND PURGE LINE (AT Y=0)
  # ====================================================================
  # (Optional) Enable filament runout sensors right before the print starts.
  #SET_FILAMENT_SENSOR SENSOR=filament_PreExtr ENABLE=1
  #SET_FILAMENT_SENSOR SENSOR=filament_PostExtr ENABLE=1

  SET_DISPLAY_TEXT MSG="Heating Hotend: {target_extruder}c..."             
  RESPOND TYPE=command MSG="Heating Hotend: {target_extruder}c..."
  
  # Turn off the part cooling fan so it doesn't blow cold air on the hotend.
  M107                                                
  # Wait for the hotend to reach the final printing temperature.
  M109 S{target_extruder}                             
  
  # Perform a final nozzle scrub now that the filament is fully molten.
  clean_nozzle                                        
  # Turn on the chamber LED lights to 50% brightness.
  SET_PIN PIN=caselight VALUE=0.50                    
  
  SET_DISPLAY_TEXT MSG="Purging filament..."         
  RESPOND TYPE=command MSG="Purging filament..."
  G90                                                 
  
  # Move to the extreme front edge of the bed (Y=0), safely away from the center.
  G0 X10 Y0 Z5 F10000                                 
  # Lower the nozzle to the first layer height (0.3mm for the purge line).
  G0 Z0.3 F1500                                       
  # Switch to relative positioning for the extrusion moves.
  G91                                                 
  # Draw the heavy purge line moving 100mm to the right.
  G1 X100 E14 F1200                                   
  
  # Switch back to absolute positioning for the rest of the print.
  G90                                                 
  # Reset the extruder distance counter to zero.
  G92 E0                                              
  # Quickly raise the Z axis to 2mm to prevent dragging the oozed filament 
  # across the bed while traveling to the actual print starting point.
  G0 Z2 F3000                                         

  SET_DISPLAY_TEXT MSG="Printer goes brr"          
  RESPOND TYPE=command MSG="Printer goes brr"

# ====================================================================
# LOCK_GANTRY_ON_BOOT
# ====================================================================
# Locks Z motorsd at statup, so that clips can be removed without lowering the gantry
[delayed_gcode lock_gantry_on_boot]
initial_duration: 2.0
gcode:
    RESPOND MSG="Z motors energized. You can now safely remove the gantry clips!"
    # Enable Z stepper drivers to lock the gantry in place
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z3 ENABLE=1

